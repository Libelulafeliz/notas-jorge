 const c=document.getElementById('cedula').value.replace(/\D/g,'');
 const e=document.getElementById('err'), r=document.getElementById('result'); e.textContent=''; r.style.display='none';
 if(c.length!==10){e.textContent='Ingrese una cédula válida de 10 dígitos.';return}
 const x=estudiantes[c]; if(!x){e.textContent='No se encontraron calificaciones para esta cédula.';return}
 nombre.textContent=x.nombre; paralelo.textContent='Paralelo '+x.paralelo; doc.textContent=x.docencia+' / 15'; pra.textContent=x.practica+' / 10';
 aut.textContent=x.autonomo+' / 10'; exa.textContent=x.examen+' / 15'; fin.textContent=x.final; mensaje.textContent=x.mensaje; r.style.display='block';
}
document.getElementById('cedula').addEventListener('keydown',e=>{if(e.key==='Enter')buscar()});
</script></body></html>
